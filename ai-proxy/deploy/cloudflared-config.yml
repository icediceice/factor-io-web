# /etc/cloudflared/config.yml — adds the ai.factor-io.com ingress for the
# Factor IO MiniMax proxy. Identical to the deployed file except for the new
# hostname block, which MUST sit above the http_status:404 catch-all: cloudflared
# matches ingress rules in order and the catch-all swallows anything after it.
tunnel: 7f569c27-159a-409d-b5f1-16a39df11d0f
credentials-file: /etc/cloudflared/7f569c27-159a-409d-b5f1-16a39df11d0f.json

# Default originRequest applies to all ingress entries unless overridden.
# Tuned for low-latency, long-lived MCP streams.
originRequest:
  connectTimeout: 10s
  tlsTimeout: 10s
  tcpKeepAlive: 15s
  keepAliveTimeout: 5m
  keepAliveConnections: 200
  noHappyEyeballs: true

ingress:
  - hostname: stock.factor-io.com
    service: http://localhost:80
  - hostname: ai.factor-io.com
    service: http://localhost:80
  - service: http_status:404