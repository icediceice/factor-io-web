# ai.factor-io.com — Factor IO MiniMax proxy.
# Shape copied from /etc/nginx/sites-available/stock-predictor, which is the
# working precedent on this host: cloudflared terminates TLS at the edge and
# reaches nginx over plain :80, so the real client IP arrives in CF-Connecting-IP.
# Install to /etc/nginx/sites-available/factor-ai and symlink into sites-enabled.

upstream factor_ai_proxy {
    server 127.0.0.1:8790;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.factor-io.com;

    # The calculator's largest turn is a bounded transcript; the proxy itself
    # caps at 256 KB and this is the matching outer bound.
    client_max_body_size 512k;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://factor_ai_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";

        # A MiniMax tool-call turn regularly runs past the nginx 60s default.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}