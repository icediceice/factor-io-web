# catcountdown.factor-io.com - Factor IO Cat Countdown static product site.
# Cloudflared terminates TLS at the edge and reaches nginx over plain :80.
# Prepared configuration only: install to /etc/nginx/sites-available/factor-catcountdown
# and symlink into /etc/nginx/sites-enabled/factor-catcountdown when launching.

server {
    listen 80;
    listen [::]:80;
    server_name catcountdown.factor-io.com;

    root /Git/factor-io-web;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Map the subdomain root explicitly to cat-countdown.html so the repository's
    # consulting index.html is never served on catcountdown.factor-io.com.
    location = / {
        try_files /cat-countdown.html =404;
    }

    location = /cat-countdown.html {
        try_files $uri =404;
    }

    location = /catcountdown {
        return 302 /cat-countdown.html$is_args$args;
    }

    location = /catcountdown/ {
        return 302 /cat-countdown.html$is_args$args;
    }
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
