# Cat Countdown edge router (src/index.js). See ../deploy/README.md for the
# architecture, release and rollback steps.

name = "catcountdown-site"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = false

# A route, not a custom domain: the existing proxied catcountdown DNS record stays
# untouched, and the Worker answers before the old tunnel origin is ever reached.
routes = [
  { pattern = "catcountdown.factor-io.com/*", zone_name = "factor-io.com" }
]

[vars]
# Empty while the iPhone app is in App Store review: iPhone scanners get the
# coming-soon page. Set this to the App Store listing URL and redeploy to release.
APP_STORE_URL = ""
# Public OAuth Web client id for the /free/<campaign> Google sign-in (not a secret).
# Empty = the giveaway pages say "not available" and allocate nothing.
GOOGLE_CLIENT_ID = ""

# Promo-code pool for /free/<campaign>; the tailnet admin (../../giveaway) writes
# campaigns and codes through the Cloudflare D1 REST API.
[[d1_databases]]
binding = "GIVEAWAY_DB"
database_name = "catcountdown-giveaway"
database_id = "db64b355-02bc-4264-a360-cb4fb3827d2a"
migrations_dir = "migrations"