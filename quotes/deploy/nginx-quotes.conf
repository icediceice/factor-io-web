# quotes.factor-io.com — Factor IO quotation system.
# Shape copied from ai-proxy/deploy/nginx-ai.conf (the host's working
# precedent): cloudflared terminates TLS, reaches nginx over plain :80.
# Install: /etc/nginx/sites-available/factor-quotes -> sites-enabled,
# then `sudo nginx -t && sudo systemctl reload nginx`.

upstream factor_quotes {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name quotes.factor-io.com;

    # quotations are small JSON; the bound is the app's own 1 MB body cap
    client_max_body_size 1m;

    location / {
        proxy_pass http://factor_quotes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}