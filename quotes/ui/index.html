<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotations · Factor I/O</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<script type="module">
import { api, fmtSatang, el, toast, statusChip, renderShell } from './app.js';

const main = renderShell('index.html', 'Quotations',
  'Author quotations, issue them into an immutable revision, and walk them through proposed → accepted before raising a tax invoice.');

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// The dashboard exists to keep two numbers apart that are easy to conflate.
// Pipeline is a FORECAST — a proposed or accepted quotation is not income and
// has no tax consequence. Recognised income is what has actually been invoiced
// and is what the Revenue Department cares about.
const statsCard = el(`<section class="card">
  <h2>Position</h2>
  <div id="stats" class="stat-row"><div class="empty">Loading…</div></div>
</section>`);

const listCard = el(`<section class="card">
  <h2>Quotations</h2>
  <div id="list"><div class="empty">Loading…</div></div>
</section>`);

const newCard = el(`<section class="card">
  <h2>New quotation</h2>
  <form id="new">
    <div class="grid">
      <label>Client
        <select name="client_id" required><option value="">Loading clients…</option></select>
      </label>
      <label>Language
        <select name="lang"><option value="en">English</option><option value="th">ไทย</option></select>
      </label>
      <label>Issue date (blank = today)
        <input name="issue_date" type="date">
      </label>
    </div>
    <label>Notes
      <textarea name="notes" rows="2" placeholder="Scope summary, references…"></textarea>
    </label>
    <div class="row-actions"><button type="submit">Create draft</button></div>
  </form>
</section>`);

main.append(statsCard, listCard, newCard);

async function loadStats() {
  const { report: r } = await api('GET', '/reports/pipeline');
  statsCard.querySelector('#stats').innerHTML = `
    <div class="stat lead">
      <div class="label">Recognised income</div>
      <div class="value">${fmtSatang(r.recognisedIncome.netSatang)}</div>
      <div class="note">${r.recognisedIncome.invoiceCount} invoice(s) · ${esc(r.recognisedIncome.basis)}</div>
    </div>
    <div class="stat">
      <div class="label">Outstanding receivable</div>
      <div class="value">${fmtSatang(r.outstandingReceivableSatang)}</div>
      <div class="note">issued invoices, still unpaid</div>
    </div>
    <div class="stat">
      <div class="label">Pipeline</div>
      <div class="value">${r.pipeline.proposedCount} / ${r.pipeline.acceptedCount}</div>
      <div class="note">proposed / accepted — ${esc(r.pipeline.note)}</div>
    </div>`;
}

// Only the moves the state machine actually allows are offered, so the UI can
// never present a button that the server will refuse.
const NEXT = {
  issued: [['proposed', 'Mark proposed'], ['declined', 'Declined']],
  proposed: [['accepted', 'Accept'], ['declined', 'Declined']],
};

async function loadList() {
  const { quotations } = await api('GET', '/quotations');
  const box = listCard.querySelector('#list');
  if (!quotations.length) {
    box.innerHTML = '<div class="empty">No quotations yet — create the first one below.</div>';
    return;
  }
  const { clients } = await api('GET', '/clients');
  const nameOf = (id) => clients.find((c) => c.id === id)?.name ?? `client #${id}`;
  box.innerHTML = `<table class="list"><thead><tr>
    <th>No.</th><th>Client</th><th>Status</th><th>Issued</th><th class="num">Total payable</th><th></th>
  </tr></thead><tbody>
    ${[...quotations].reverse().map((q) => `<tr>
      <td class="mono"><a href="quote.html?id=${q.id}">${esc(q.number)}</a></td>
      <td>${esc(nameOf(q.client_id))}</td>
      <td>${statusChip(q.status)}</td>
      <td class="mono">${esc(q.issue_date) || ''}</td>
      <td class="num muted" data-id="${q.id}">…</td>
      <td class="row-actions" style="margin:0">
        ${(NEXT[q.status] ?? []).map(([s, label]) =>
          `<button class="quiet" data-id="${q.id}" data-to="${s}">${label}</button>`).join('')}
        ${q.status === 'accepted' ? '<a class="button quiet" href="invoices.html">Raise invoice</a>' : ''}
        <a class="button quiet" href="quote.html?id=${q.id}">Open</a>
      </td>
    </tr>`).join('')}
  </tbody></table>`;

  box.querySelectorAll('button[data-to]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        await api('POST', `/quotations/${btn.dataset.id}/status`, { status: btn.dataset.to });
        toast(`Marked ${btn.dataset.to}`);
        await Promise.all([loadList(), loadStats()]);
      } catch (e) { toast(e.message, 'error'); btn.disabled = false; }
    });
  });

  // Totals need the built document, so fill them lazily per row.
  for (const q of quotations) {
    api('GET', `/quotations/${q.id}`).then((d) => {
      const cell = box.querySelector(`td[data-id="${q.id}"]`);
      if (cell) cell.textContent = fmtSatang(d.totals.payableSatang, d.totals.currency);
    }).catch(() => {});
  }
}

async function loadClients(select) {
  const { clients } = await api('GET', '/clients');
  select.innerHTML = clients.length
    ? clients.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('')
    : '<option value="">— create a client first —</option>';
}

newCard.querySelector('#new').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    const body = { client_id: Number(f.get('client_id')), lang: f.get('lang'), notes: f.get('notes') };
    if (f.get('issue_date')) body.issue_date = f.get('issue_date');
    const { quotation } = await api('POST', '/quotations', body);
    toast(`Created ${quotation.number}`);
    location.href = `quote.html?id=${quotation.id}`;
  } catch (err) { toast(err.message, 'error'); }
});

loadClients(newCard.querySelector('select[name=client_id]')).catch((e) => toast(e.message, 'error'));
loadStats().catch((e) => toast(e.message, 'error'));
loadList().catch((e) => toast(e.message, 'error'));
</script>
</body>
</html>
