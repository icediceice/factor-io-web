<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice · Factor IO</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!--
  invoice.html?id=N is the SAME Workbench as invoices.html, opened with that
  invoice selected. It stays a distinct page so every link the previous build
  handed out — and every "From quotation" cross-reference — keeps resolving.
-->
<script type="module">
import { renderShell, toast } from './app.js';
import { mount } from './screens/invoices.js';

const main = renderShell('invoices.html', 'Tax invoices',
  'A draft invoice carries provisional rates. Issuing it freezes the VAT and withholding rates onto the document and sets the tax point.');

mount(main).catch((e) => toast(e.message, 'error'));
</script>
</body>
</html>
