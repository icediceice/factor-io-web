<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices · Factor IO</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<script type="module">
import { renderShell, toast } from './app.js';
import { mount } from './screens/invoices.js';

const main = renderShell('invoices.html', 'Tax invoices',
  'Raising an invoice freezes the VAT and withholding rates onto it. The issue date is the tax point — it is the date the income is recognised and the date the VAT falls into a PP 30 period.');

mount(main).catch((e) => toast(e.message, 'error'));
</script>
