<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotation · Factor IO</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<script type="module">
import { api, fmtSatang, el, toast, statusChip, renderShell } from './app.js';

const id = new URLSearchParams(location.search).get('id');
if (!id) { document.body.textContent = 'Missing ?id='; throw new Error('missing id'); }

// The line vocabulary is operator-editable (the line.kinds setting), so the
// form asks the server for it instead of shipping its own copy — the select
// and the validation then always agree. The fallback is the pair that existed
// before the vocabulary opened up: a settings or network fault degrades the
// form to service|hardware rather than leaving an empty select.
const FALLBACK_KINDS = [{ code: 'service', en: 'Service' }, { code: 'hardware', en: 'Hardware' }];
const FALLBACK_PERIODS = [
  { code: 'once', en: 'One-time' }, { code: 'monthly', en: 'Monthly' },
  { code: 'quarterly', en: 'Quarterly' }, { code: 'yearly', en: 'Yearly' },
];
const vocab = { kinds: FALLBACK_KINDS, billingPeriods: FALLBACK_PERIODS };
try {
  const v = await api('GET', '/line-kinds');
  if (Array.isArray(v.kinds) && v.kinds.length) vocab.kinds = v.kinds;
  if (Array.isArray(v.billing_periods) && v.billing_periods.length) vocab.billingPeriods = v.billing_periods;
} catch { toast('Using the built-in type list — /line-kinds is unavailable', 'error'); }

const opts = (list) => list.map((k) => `<option value="${k.code}">${k.en ?? k.code}</option>`).join('');

let doc = null;
let main = null;

// Labels come from the same settings row the PDF renders from; the raw code is
// the fallback so a kind added without a label still reads as something.
const kindLabel = (code) => doc.kindLabels?.[code] ?? code;
const periodLabel = (code) => (code && code !== 'once' ? `/${code.replace(/ly$/, '')}` : 'once');

// The statuses in which the server will accept a change — quote.mjs
// EDITABLE_STATUSES. Held as a literal because the page has no other reason to
// ask the server, and a mismatch degrades safely: the server is the authority
// and refuses anything this list wrongly allows.
const EDITABLE = ['draft', 'issued', 'proposed'];

// An issued quotation is editable but NOT edited by accident: the fields stay
// locked behind an explicit Revise click. Module state, so it survives the
// re-render that follows every save, and resets when the page is reloaded.
let revising = false;

function headerCard() {
  const q = doc.quotation;
  const draft = q.status === 'draft';
  const editable = EDITABLE.includes(q.status);
  const unlocked = draft || revising;
  const stale = !!q.revisionStale;
  const nextRev = (q.revision || 0) + 1;
  // The server refuses the PDF of an issued or proposed quotation that no
  // longer matches its snapshot, so the link is not offered as though it would
  // work — the operator is pointed at the re-issue that fixes it instead.
  const pdfBlocked = stale && editable && !draft;
  return el(`<section class="card">
    <div style="display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:baseline">
      <h2 style="margin:0"><span class="mono">${q.number}</span> ${statusChip(q.status)}${
        q.revision >= 2 ? ` <span class="mono muted">Rev. ${q.revision}</span>` : ''}</h2>
      <div class="row-actions" style="margin:0">
        ${draft ? `<button id="issue">Issue (snapshot rev)</button>` : ''}
        ${draft ? `<button id="delete" class="danger">Delete draft</button>` : ''}
        ${editable && !draft && !revising ? `<button id="revise">Revise</button>` : ''}
        ${!draft && revising ? `<button id="lock" class="quiet">Done editing</button>` : ''}
        ${stale && editable ? `<button id="reissue">Re-issue as Rev. ${nextRev}</button>` : ''}
        ${pdfBlocked
          ? `<span class="muted">PDF available after re-issue</span>`
          : `<a class="button" href="/api/quotations/${q.id}/pdf?lang=en" target="_blank" rel="noopener">PDF EN</a>
        <a class="button" href="/api/quotations/${q.id}/pdf?lang=th" target="_blank" rel="noopener">PDF ไทย</a>`}
      </div>
    </div>
    ${stale ? `<div style="margin-top:14px;padding:10px 12px;border:1px solid var(--focus);color:var(--focus)">
      Edited since <b>Rev. ${q.revision}</b>. Re-issue to record the correction as Rev. ${nextRev} —
      until then this quotation does not match any stored revision and its PDF is unavailable.
    </div>` : ''}
    <dl class="kv" style="margin-top:14px">
      <dt>Client</dt><dd>${doc.client?.name ?? '—'}</dd>
      <dt>Language / currency</dt><dd>${q.lang} · ${q.currency}${q.fxRate ? ` (1 ${q.fxBase || 'USD'} = ${q.fxRate} THB)` : ''}</dd>
      <dt>Issue date</dt><dd>${q.issueDate}</dd>
      <dt>Valid until</dt><dd>${q.validUntil}</dd>
      <dt>Revision</dt><dd>${q.revision
        ? `Rev. ${q.revision}${stale ? ' <span class="muted">— edited since</span>' : ''}`
        : '<span class="muted">not issued yet</span>'}</dd>
      <dt>Contract term</dt><dd>${unlocked
        ? `<form id="term" style="display:inline-flex;gap:8px;align-items:baseline">
             <input name="term_months" value="${q.termMonths ?? 0}" inputmode="numeric" style="width:5em">
             <span class="muted">months</span>
             <button type="submit" class="quiet">Set</button>
           </form>`
        : (q.termMonths ? `${q.termMonths} months` : '<span class="muted">not stated</span>')}
        <div class="muted" style="font-size:.85em">Extends recurring lines into a contract total. 0 = no term stated.</div>
      </dd>
      ${q.notes ? `<dt>Notes</dt><dd>${q.notes}</dd>` : ''}
    </dl>
  </section>`);
}

function linesCard() {
  const q = doc.quotation;
  const editable = EDITABLE.includes(q.status);
  // Locked is no longer the same as "not a draft": an issued or proposed
  // quotation is correctable, it just waits for an explicit Revise first.
  const frozen = !(q.status === 'draft' || revising);
  const note = !editable
    ? '<span class="muted">(final — this quotation can no longer be edited)</span>'
    : (frozen ? '<span class="muted">(issued — press Revise to correct)</span>' : '');
  return el(`<section class="card">
    <h2>Lines ${note}</h2>
    <div id="lines"></div>
    ${frozen ? '' : `
    <form id="addLine" style="margin-top:16px">
      <div class="grid">
        <label>Type
          <select name="kind">${opts(vocab.kinds)}</select>
        </label>
        <label>Billing
          <select name="billing_period">${opts(vocab.billingPeriods)}</select>
        </label>
        <label>Quantity <input name="qty" required placeholder="0.5" inputmode="decimal"></label>
        <label>Unit <input name="unit" placeholder="auto"></label>
        <label>Unit price (THB) <input name="unit_price" required placeholder="35000.00" inputmode="decimal"></label>
        <label>Discount (satang) <input name="discount_satang" value="0" inputmode="numeric"></label>
      </div>
      <div class="grid">
        <label>Section <input name="section" placeholder="Hardware"></label>
        <label style="align-self:end"><input type="checkbox" name="optional" value="1"> Optional (priced, excluded from totals)</label>
      </div>
      <label>Description (EN) <input name="description_en" required></label>
      <label>Description (TH) <input name="description_th" placeholder="คำอธิบายภาษาไทย (ถ้ามี)"></label>
      <div class="row-actions"><button type="submit">Add line</button></div>
    </form>`}
  </section>`);
}

// The revision history IS the audit trail for a quotation corrected in place:
// the number never changes, so this list is the only record of what went out,
// when, and on whose authority. GET /quotations/:id/revisions has existed
// since snapshots were introduced and was never surfaced anywhere.
let revisions = [];

function revisionsCard() {
  const rows = revisions.length
    ? `<table class="list"><thead><tr><th>Rev</th><th>Recorded</th><th>By</th><th></th></tr></thead><tbody>
      ${revisions.map((r) => `<tr>
        <td class="mono">${r.rev}</td>
        <td class="mono">${r.created_at} <span class="muted">UTC</span></td>
        <td>${r.actor}</td>
        <td><a href="/api/quotations/${id}/revisions/${r.rev}" target="_blank" rel="noopener">snapshot</a></td>
      </tr>`).join('')}
    </tbody></table>`
    : '<div class="empty">Not issued yet — issuing writes Rev. 1.</div>';
  return el(`<section class="card">
    <h2>Revisions</h2>
    ${rows}
  </section>`);
}

function renderLines() {
  const box = document.querySelector('#lines'); // lives in linesCard(), a sibling of docCard
  if (!doc.lines.length) { box.innerHTML = '<div class="empty">No lines yet.</div>'; }
  else {
    box.innerHTML = `<table class="list"><thead><tr>
      <th>#</th><th>Description</th><th>Type</th><th>Billing</th><th>Section</th><th class="num">Qty</th><th>Unit</th><th class="num">Unit price</th><th class="num">Discount</th><th class="num">Subtotal</th><th></th>
    </tr></thead><tbody>
      ${doc.lines.map((l) => `<tr${l.optional ? ' class="muted"' : ''}>
        <td>${l.optional ? '○' : l.position}</td>
        <td><strong>${l.descriptionEn}</strong>${l.optional ? ' <span class="mono">[OPTION]</span>' : ''}${l.descriptionTh ? `<br><span class="muted">${l.descriptionTh}</span>` : ''}</td>
        <td>${kindLabel(l.kind)}</td>
        <td>${periodLabel(l.billingPeriod)}</td>
        <td>${l.section || '—'}</td>
        <td class="num">${l.qty}</td>
        <td>${l.unit}</td>
        <td class="num">${fmtSatang(l.unitSatang)}</td>
        <td class="num">${l.discountSatang ? `−${fmtSatang(l.discountSatang)}` : '—'}</td>
        <td class="num">${fmtSatang(l.subtotalSatang)}</td>
        <td>${doc.quotation.status === 'draft' || revising ? `<button class="quiet" data-del="${l.id}">Remove</button>` : ''}</td>
      </tr>`).join('')}
    </tbody></table>`;
    for (const b of box.querySelectorAll('[data-del]')) {
      b.addEventListener('click', async () => {
        try { await refresh(api('DELETE', `/quotations/${id}/lines/${b.dataset.del}`)); }
        catch (e) { toast(e.message, 'error'); }
      });
    }
  }
  const t = doc.totals;
  // The split, the contract total and the options line each appear only when
  // they carry a figure, so a plain one-off quotation shows the totals block
  // it has always shown.
  const split = t.hasRecurring ? [
    t.oneTimeSatang ? `<tr class="memo"><td class="lbl">One-time</td><td class="num">${fmtSatang(t.oneTimeSatang)}</td></tr>` : '',
    ...['monthly', 'quarterly', 'yearly']
      .filter((p) => t.recurringSatang?.[p])
      .map((p) => `<tr class="memo"><td class="lbl">Recurring ${p}</td><td class="num">${fmtSatang(t.recurringSatang[p])}</td></tr>`),
  ].filter(Boolean).join('') : '';
  docCard.querySelector('#totals').innerHTML = `<table class="totals">
    ${split}
    <tr class="memo"><td class="lbl">Subtotal</td><td class="num">${fmtSatang(t.subtotalSatang)}</td></tr>
    ${t.discountSatang ? `<tr class="memo"><td class="lbl">Discount</td><td class="num">−${fmtSatang(t.discountSatang)}</td></tr>` : ''}
    <tr><td class="lbl">Net</td><td class="num">${fmtSatang(t.netSatang)}</td></tr>
    <tr><td class="lbl">VAT ${t.vatRate}%</td><td class="num">${fmtSatang(t.vatSatang)}</td></tr>
    <tr class="grand"><td class="lbl">Grand total</td><td class="num">${fmtSatang(t.grandSatang)}</td></tr>
    ${t.whtSatang ? `<tr${t.whtMode === 'deduct' ? '' : ' class="memo"'}><td class="lbl">WHT ${t.whtRate}% (${t.whtMode})</td><td class="num">${t.whtMode === 'deduct' ? '−' : ''}${fmtSatang(t.whtSatang)}</td></tr>` : ''}
    <tr class="payable"><td class="lbl">Total payable</td><td class="num">${fmtSatang(t.payableSatang)}</td></tr>
    ${t.contractTotalSatang != null ? `<tr class="payable"><td class="lbl">Contract total (${t.termMonths} months)</td><td class="num">${fmtSatang(t.contractTotalSatang)}</td></tr>` : ''}
    ${t.optionalSatang ? `<tr class="memo"><td class="lbl">Options (not included)</td><td class="num">${fmtSatang(t.optionalSatang)}</td></tr>` : ''}
  </table>`;
}

let docCard = null;

function renderAll() {
  main.innerHTML = '';
  docCard = el('<div></div>');
  const h = headerCard();
  docCard.append(el('<section class="card"><h2>Totals</h2><div id="totals"></div></section>'));
  main.append(h, docCard, linesCard());
  bindHeader(h);
  renderLines();
}

function bindHeader(h) {
  const issue = h.querySelector('#issue');
  if (issue) issue.addEventListener('click', async () => {
    try { await refresh(api('POST', `/quotations/${id}/issue`)); toast('Issued — revision snapshot written'); }
    catch (e) { toast(e.message, 'error'); }
  });
  const del = h.querySelector('#delete');
  if (del) del.addEventListener('click', async () => {
    try { await api('DELETE', `/quotations/${id}`); location.href = 'index.html'; }
    catch (e) { toast(e.message, 'error'); }
  });
  // Revise and Done editing only move the page's own lock. Nothing is sent:
  // the quotation's status does not change because it is being corrected.
  const revise = h.querySelector('#revise');
  if (revise) revise.addEventListener('click', () => {
    revising = true;
    renderAll();
    toast('Editing unlocked — re-issue when the correction is done');
  });
  const lock = h.querySelector('#lock');
  if (lock) lock.addEventListener('click', () => { revising = false; renderAll(); });
  const reissue = h.querySelector('#reissue');
  if (reissue) reissue.addEventListener('click', async () => {
    try {
      const res = await refresh(api('POST', `/quotations/${id}/issue`));
      revising = false;
      renderAll();
      toast(`Re-issued — revision ${doc.quotation.revision} recorded`);
      return res;
    } catch (e) { toast(e.message, 'error'); }
  });
}

async function refresh(promise) {
  const data = await promise;
  doc = data.quotation ? data : await api('GET', `/quotations/${id}`);
  renderAll();
}

main = renderShell('quote.html', `Quotation`, 'Issuing writes an immutable revision snapshot. A quotation that has gone out can still be corrected — press Revise, fix it, then re-issue to record the correction as the next revision. Accepted onwards is final.');

try { await refresh(api('GET', `/quotations/${id}`)); }
catch (e) { main.append(el(`<div class="card"><div class="empty">${e.message}</div></div>`)); }

// wire the forms after render (they live inside cards renderAll() rebuilds)
document.addEventListener('submit', async (e) => {
  if (e.target.id === 'term') {
    e.preventDefault();
    const months = new FormData(e.target).get('term_months');
    try { await refresh(api('PUT', `/quotations/${id}`, { term_months: Number(months) })); toast('Contract term saved'); }
    catch (err) { toast(err.message, 'error'); }
    return;
  }
  if (e.target.id !== 'addLine') return;
  e.preventDefault();
  const f = new FormData(e.target);
  const body = {
    kind: f.get('kind'),
    billing_period: f.get('billing_period'),
    description_en: f.get('description_en'),
    description_th: f.get('description_th'),
    qty: f.get('qty'),
    unit_price: f.get('unit_price'),
    discount_satang: Number(f.get('discount_satang') || 0),
    optional: f.get('optional') === '1',
  };
  if (f.get('unit')) body.unit = f.get('unit');
  if (f.get('section')) body.section = f.get('section');
  try { await refresh(api('POST', `/quotations/${id}/lines`, body)); toast('Line added'); }
  catch (err) { toast(err.message, 'error'); }
});
</script>
</body>
</html>
