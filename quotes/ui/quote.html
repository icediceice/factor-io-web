<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotation · Factor IO</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!--
  quote.html?id=N is the SAME Workbench as index.html, opened with that
  quotation selected. It stays a distinct page so every link, bookmark and
  redirect the previous build handed out keeps resolving to the same record.
-->
<script type="module">
import { renderShell, toast } from './app.js';
import { mount } from './screens/quotations.js';

const main = renderShell('index.html', 'Quotations',
  'Issuing writes an immutable revision snapshot. A quotation that has gone out can still be corrected — press Revise, fix it, then re-issue to record the correction as the next revision. Accepted onwards is final.');

mount(main).catch((e) => toast(e.message, 'error'));
</script>
</body>
</html>
